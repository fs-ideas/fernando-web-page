<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fernando Silveira</title>
  <link rel="icon" href="assets/fs_logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141210;
      --surface: #1c1917;
      --ink: #e8e2d9;
      --muted: #6b6560;
      --rule: #2a2723;
      --accent: #c9a96e;
      --accent-dim: #7a6340;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
    }

    /* GRAIN */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 45% at 50% 20%, rgba(201,169,110,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* LANGUAGE */
    .lang-toggle {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .lang-toggle a { display: flex; opacity: 0.4; transition: opacity 0.2s ease; }
    .lang-toggle a:hover { opacity: 1; }
    .lang-toggle .lang-active { display: flex; }

    .lang-toggle img {
      width: 22px;
      height: 22px;
      object-fit: cover;
      border-radius: 2px;
    }

    .lang-toggle .lang-sep {
      font-family: 'DM Mono', monospace;
      font-size: 0.5rem;
      color: var(--rule);
    }

    /* PAGE */
    main {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 5.5rem 0 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .photo {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent-dim);
      padding: 5px;
      background: var(--surface);
      background-clip: content-box;
      opacity: 0;
      animation: fadeUp 1s ease 0.2s forwards;
    }

    h1 {
      margin-top: 1.8rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.3rem;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
      opacity: 0;
      animation: fadeUp 1s ease 0.35s forwards;
    }

    h1 .last { color: var(--accent); font-style: italic; }

    .place {
      margin-top: 0.9rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1s ease 0.45s forwards;
    }

    /* LINKS */
    .links {
      list-style: none;
      width: 100%;
      margin-top: 2.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .links li {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
    }

    .links li:nth-child(1) { animation-delay: 0.55s; }
    .links li:nth-child(2) { animation-delay: 0.65s; }
    .links li:nth-child(3) { animation-delay: 0.75s; }
    .links li:nth-child(4) { animation-delay: 0.85s; }

    .link {
      display: block;
      position: relative;
      overflow: hidden;
      padding: 1.15rem 1.5rem;
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.3rem;
      font-style: italic;
      transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
    }

    .link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .link:hover,
    .link:focus-visible {
      border-color: var(--accent-dim);
      color: var(--accent);
      outline: none;
    }

    .link:hover::after,
    .link:focus-visible::after { transform: scaleX(1); }

    .student-area {
      margin-top: 2.2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-dim);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.2rem;
      transition: color 0.25s, border-color 0.25s;
      opacity: 0;
      animation: fadeUp 0.9s ease 1s forwards;
    }

    .student-area:hover { color: var(--accent); border-color: var(--accent-dim); }

    footer {
      position: relative;
      padding: 2rem 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    footer a { color: var(--muted); text-decoration: none; transition: color 0.25s; }
    footer a:hover { color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo, h1, .place, .links li, .student-area { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="lang-toggle">
    <span class="lang-active" title="English"><img src="assets/usa-flag-icon.svg" alt="English" /></span>
    <span class="lang-sep">/</span>
    <a href="index-pt.html" title="Português"><img src="assets/brazil-flag-icon.svg" alt="Português" /></a>
  </div>

  <main>
    <img class="photo" src="assets/fernando.jpg" alt="Fernando Silveira" onerror="this.onerror=null;this.src='assets/fs_logo.svg';" />
    <h1>Fernando <span class="last">Silveira</span></h1>
    <p class="place">Campinas · Brazil</p>

    <ul class="links">
      <li><a class="link" href="forma-web-eng.html">Teacher</a></li>
      <li><a class="link" href="writings.html">Writer</a></li>
      <li><a class="link" href="https://www.benextsolutions.com.br" target="_blank" rel="noopener noreferrer">Entrepreneur</a></li>
      <li><a class="link" href="musician.html">Musician</a></li>
    </ul>

    <a class="student-area" href="https://forma-web.fernandosilveira.com" target="_blank" rel="noopener noreferrer">Student Area</a>
  </main>

  <footer>
    <a href="mailto:fernando@fernandosilveira.com">fernando@fernandosilveira.com</a>
  </footer>

</body>
</html>
